<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Exponential</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="top-txt">
        <span class="eyebrow" id="h-eyebrow">Exponential</span>
        <h1 id="h-title">Cargando tu plan…</h1>
        <span class="sub" id="h-sub"></span>
      </div>
      <button class="sync-btn" id="sync" data-s="local" aria-label="Estado de sincronización"><span class="sync-dot"></span><span id="sync-txt">Local</span></button>
    </div>
    <div id="h-extra"></div>
  </header>

  <main>
    <section class="view" id="v-hoy"></section>
    <section class="view" id="v-semana" hidden></section>
    <section class="view" id="v-ano" hidden></section>
    <section class="view" id="v-mas" hidden></section>
  </main>
</div>

<nav class="nav" aria-label="Secciones">
  <div class="nav-in">
    <button data-tab="hoy" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Hoy</button>
    <button data-tab="semana">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Semana</button>
    <button data-tab="ano">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>Año</button>
    <button data-tab="mas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Más</button>
  </div>
</nav>

<div id="sheet-root"></div>
<div id="timer-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
