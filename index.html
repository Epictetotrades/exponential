<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efebe3">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Exponential</title>
<script>
/* El tema se aplica antes de pintar para que la app no parpadee con otro color. */
(function () {
  var fondo = {hueso: "#efebe3", grafito: "#111214", papel: "#f4f1ea", onix: "#0a0a0b", niebla: "#e7e8ea"}, id = "hueso";
  try {
    var t = JSON.parse(localStorage.getItem("exp-tema") || "null") || {}, m = t.modo || "hueso";
    var oscuro = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    id = m === "auto" ? (oscuro ? (t.oscuro || "grafito") : (t.claro || "hueso")) : m;
    if (!fondo[id]) id = "hueso";
  } catch (e) {}
  document.documentElement.setAttribute("data-tema", id);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", fondo[id]);
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <span class="eyebrow" id="h-eyebrow">Exponential</span>
      <button class="sync-btn" id="sync" data-s="local" aria-label="Estado de sincronización"><span class="sync-dot"></span><span id="sync-txt">Local</span></button>
    </div>
    <div class="cinta" id="cinta" role="img" aria-label="El año en 52 semanas"></div>
  </header>

  <main>
    <section class="view" id="v-hoy"></section>
    <section class="view" id="v-semana" hidden></section>
    <section class="view" id="v-ano" hidden></section>
    <section class="view" id="v-mas" hidden></section>
  </main>
</div>

<div id="dock-root"></div>
<nav class="nav" aria-label="Secciones">
  <div class="nav-in">
    <button data-tab="hoy" aria-current="page">Hoy<i></i></button>
    <button data-tab="semana">Semana<i></i></button>
    <button data-tab="ano">Año<i></i></button>
    <button data-tab="mas">Más<i></i></button>
  </div>
</nav>

<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
